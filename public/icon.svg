<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" /> <!-- indigo-950 -->
      <stop offset="60%" stop-color="#0f172a" /> <!-- slate-900 -->
      <stop offset="100%" stop-color="#020617" /> <!-- slate-950 -->
    </linearGradient>

    <!-- Metallic Rod Gradient -->
    <linearGradient id="rodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Bead Wood Gradient -->
    <radialGradient id="beadGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24" />  <!-- amber-400 -->
      <stop offset="50%" stop-color="#d97706" />  <!-- amber-600 -->
      <stop offset="85%" stop-color="#92400e" />  <!-- amber-800 -->
      <stop offset="100%" stop-color="#78350f" /> <!-- amber-900 -->
    </radialGradient>

    <!-- Bead Inner Highlight -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    
    <filter id="beadShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Icon Container with Soft Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Glow -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#6366f1" stroke-width="3" stroke-opacity="0.15" />

  <!-- The Abacus Rod (Metallic wire) -->
  <rect x="246" y="48" width="20" height="416" rx="10" fill="url(#rodGrad)" filter="url(#dropShadow)" />
  
  <!-- Rod Stopper Top -->
  <rect x="236" y="36" width="40" height="16" rx="4" fill="#1e293b" />
  
  <!-- Rod Stopper Bottom -->
  <rect x="236" y="460" width="40" height="16" rx="4" fill="#1e293b" />

  <!-- The Wood Abacus Bead (Sleek bi-conical diamond-like shape) -->
  <g filter="url(#beadShadow)">
    <!-- Main bead geometry (rhombus with rounded edges) -->
    <path d="M 120,256 C 120,210 210,140 256,140 C 302,140 392,210 392,256 C 392,302 302,372 256,372 C 210,372 120,302 120,256 Z" fill="url(#beadGrad)" />
    
    <!-- Central Bead Hole Rim for the Rod -->
    <ellipse cx="256" cy="256" rx="14" ry="8" fill="#451a03" opacity="0.8" />
    <ellipse cx="256" cy="256" rx="11" ry="5" fill="#170c04" />
    
    <!-- Premium Top Glossy Highlight -->
    <path d="M 140,240 C 140,205 215,155 256,155 C 297,155 372,205 372,240 C 330,195 285,185 256,185 C 227,185 182,195 140,240 Z" fill="url(#highlightGrad)" />
  </g>

  <!-- Minimal decorative dots in corner symbolizing active beads -->
  <circle cx="90" cy="90" r="10" fill="#fbbf24" opacity="0.3" />
  <circle cx="422" cy="422" r="10" fill="#fbbf24" opacity="0.3" />
</svg>
